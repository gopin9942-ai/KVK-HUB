<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101321">
<title>KVK VOICE APP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101321;color:white}
header{text-align:center;padding:25px 15px;background:#191f35}
header h1{color:#45d9ff;margin:0} header p{color:#aab5d0}
main{max-width:450px;margin:auto;padding:20px}
.card{background:#1b2239;border:1px solid #303954;border-radius:16px;padding:22px;margin-top:20px}
button{width:100%;padding:14px;margin-top:13px;border:0;border-radius:10px;background:#35c9f4;color:#101321;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}.secondary{background:#303954;color:white}
input{width:100%;padding:14px;margin-top:12px;border-radius:9px;border:1px solid #46516e;background:#101321;color:white;font-size:15px}
#homePage,#voicePanel{display:none}
#status{text-align:center;color:#45d9ff;margin-top:20px;overflow-wrap:anywhere}
.small{color:#aab5d0;font-size:13px;line-height:1.5}
#roomInfo{overflow-wrap:anywhere;color:#45d9ff}
</style>
</head>
<body>
<header><h1>KVK HUB</h1><p>Connect • Talk • Enjoy</p></header>
<main>
<section id="loginPage" class="card">
<h2>Welcome to KVK HUB 🎙️</h2><p>Sign in to connect with your friends.</p>
<button id="loginBtn">Continue with Google</button>
</section>
<section id="homePage">
<div class="card"><h2>Welcome!</h2><p id="userName"></p><button class="secondary" id="logoutBtn">Logout</button></div>
<div class="card"><h2>🌍 Public Rooms</h2><p>Public room directory is coming next.</p><button id="exploreBtn" class="secondary">Explore Rooms</button></div>
<div class="card"><h2>🔒 Room</h2><p class="small">Create a room code or enter an existing code to test voice chat.</p>
<input id="roomCode" placeholder="Enter Room Code" maxlength="40">
<button id="joinBtn">Join Room</button><button class="secondary" id="createBtn">Create Room</button>
</div>
<div class="card" id="voicePanel"><h2>🎙️ Voice Room</h2><p id="roomInfo"></p>
<button id="muteBtn" class="secondary">Mute Microphone</button><button id="leaveBtn">Leave Room</button>
</div>
</section>
<p id="status">Checking login...</p>
</main>
<script type="module">
import {loginWithGoogle,logoutUser,auth,onAuthStateChanged} from "./firebase.js";
import {Room,RoomEvent} from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";

const WORKER_URL="https://kvk-voice-hub.bragathees3333.workers.dev";
const loginPage=document.getElementById("loginPage");
const homePage=document.getElementById("homePage");
const status=document.getElementById("status");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const voicePanel=document.getElementById("voicePanel");
let activeRoom=null;
let micEnabled=true;

function showHome(user){
 loginPage.style.display="none";homePage.style.display="block";
 document.getElementById("userName").textContent="Hello, "+(user.displayName||"User");
 status.textContent="You are logged in!";
}
function showLogin(){
 loginPage.style.display="block";homePage.style.display="none";voicePanel.style.display="none";
 status.textContent="Please login to continue.";
}
async function connectVoiceRoom(roomName){
 if(!auth.currentUser) throw new Error("Please login first.");
 if(activeRoom) await leaveVoiceRoom();
 status.textContent="Connecting to voice room...";
 const idToken=await auth.currentUser.getIdToken();
 const response=await fetch(WORKER_URL+"/token",{
  method:"POST",
  headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},
  body:JSON.stringify({roomName})
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok) throw new Error(data.error||"Token request failed ("+response.status+")");
 if(!data.token||!data.serverUrl) throw new Error("Worker response is missing token or serverUrl.");
 const room=new Room();
 room.on(RoomEvent.Disconnected,()=>{
  if(activeRoom===room){activeRoom=null;voicePanel.style.display="none";status.textContent="Disconnected from room.";}
 });
 await room.connect(data.serverUrl,data.token);
 try{await room.localParticipant.setMicrophoneEnabled(true);}
 catch(e){await room.disconnect();throw new Error("Microphone permission/device error: "+e.message);}
 activeRoom=room;micEnabled=true;
 document.getElementById("roomInfo").textContent="Connected: "+roomName;
 document.getElementById("muteBtn").textContent="Mute Microphone";
 voicePanel.style.display="block";
 status.textContent="Voice connected! Allow microphone access if asked.";
}
async function leaveVoiceRoom(){
 if(activeRoom){const room=activeRoom;activeRoom=null;await room.disconnect();}
 voicePanel.style.display="none";status.textContent="You left the room.";
}
loginBtn.onclick=async()=>{
 loginBtn.disabled=true;status.textContent="Connecting to Google...";
 try{await loginWithGoogle();}
 catch(error){console.error(error);status.textContent="Login Error: "+(error.code||error.message);}
 finally{loginBtn.disabled=false;}
};
logoutBtn.onclick=async()=>{
 logoutBtn.disabled=true;
 try{await leaveVoiceRoom();await logoutUser();}
 catch(error){console.error(error);status.textContent="Logout Error: "+error.message;}
 finally{logoutBtn.disabled=false;}
};
onAuthStateChanged(auth,user=>{if(user)showHome(user);else showLogin();});
document.getElementById("exploreBtn").onclick=()=>{status.textContent="Public room directory is not connected yet.";};
document.getElementById("joinBtn").onclick=async()=>{
 const code=document.getElementById("roomCode").value.trim();
 if(!code){status.textContent="Enter a room code!";return;}
 if(!/^[a-zA-Z0-9_-]{3,40}$/.test(code)){status.textContent="Use 3–40 letters, numbers, - or _.";return;}
 try{await connectVoiceRoom(code);}
 catch(error){console.error(error);status.textContent="Voice Error: "+error.message;}
};
const createBtn=document.getElementById("createBtn");
createBtn.onclick=async()=>{
 const code="kvk-"+Math.random().toString(36).slice(2,8);
 document.getElementById("roomCode").value=code;
 createBtn.disabled=true;
 status.textContent="Creating room... Please wait.";
 try{
  await connectVoiceRoom(code);
  status.textContent="Room created! Share code: "+code;
 }catch(error){
  console.error("Create room failed:",error);
  status.textContent="ROOM ERROR: "+(error?.message||String(error));
 }finally{
  createBtn.disabled=false;
 }
};
window.addEventListener("error",event=>{
 status.textContent="APP ERROR: "+(event.message||"Unknown JavaScript error");
});
window.addEventListener("unhandledrejection",event=>{
 const reason=event.reason;
 status.textContent="APP ERROR: "+(reason?.message||String(reason||"Unknown promise error"));
});
document.getElementById("muteBtn").onclick=async()=>{
 if(!activeRoom)return;
 try{micEnabled=!micEnabled;await activeRoom.localParticipant.setMicrophoneEnabled(micEnabled);
 document.getElementById("muteBtn").textContent=micEnabled?"Mute Microphone":"Unmute Microphone";}
 catch(error){console.error(error);status.textContent="Microphone Error: "+error.message;}
};
document.getElementById("leaveBtn").onclick=leaveVoiceRoom;
</script>
</body>
</html>
