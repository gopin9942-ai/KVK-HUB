
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101321">
<title>KVK VOICE APP</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101321;
  color: white;
}

header {
  text-align: center;
  padding: 25px 15px;
  background: #191f35;
}

header h1 {
  color: #45d9ff;
  margin: 0;
}

header p { color: #aab5d0; }

main {
  max-width: 450px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1b2239;
  border: 1px solid #303954;
  border-radius: 16px;
  padding: 22px;
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 13px;
  border: 0;
  border-radius: 10px;
  background: #35c9f4;
  color: #101321;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #303954;
  color: white;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  border: 1px solid #46516e;
  background: #101321;
  color: white;
  font-size: 15px;
}

#homePage { display: none; }

#status {
  text-align: center;
  color: #45d9ff;
  margin-top: 20px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
  <h1>KVK HUB</h1>
  <p>Connect • Talk • Enjoy</p>
</header>

<main>

<!-- LOGIN PAGE -->
<section id="loginPage" class="card">
  <h2>Welcome to KVK HUB 🎙️</h2>
  <p>Sign in to connect with your friends.</p>
  <button id="loginBtn">Continue with Google</button>
</section>

<!-- HOME PAGE -->
<section id="homePage">

  <div class="card">
    <h2>Welcome!</h2>
    <p id="userName"></p>
    <button class="secondary" id="logoutBtn">Logout</button>
  </div>

  <div class="card">
    <h2>🌍 Public Rooms</h2>
    <p>Join public voice rooms.</p>
    <button id="exploreBtn">Explore Rooms</button>
  </div>

  <div class="card">
    <h2>🔒 Private Room</h2>
    <input id="roomCode" placeholder="Enter Room Code">
    <button id="joinBtn">Join Room</button>
    <button class="secondary" id="createBtn">
      Create Private Room
    </button>
  </div>

</section>

<p id="status">Please login to continue.</p>

</main>

<script type="module">
import { loginWithGoogle } from "./firebase.js";

const loginPage = document.getElementById("loginPage");
const homePage = document.getElementById("homePage");
const status = document.getElementById("status");

function showHome(user) {
  loginPage.style.display = "none";
  homePage.style.display = "block";
  document.getElementById("userName").textContent =
    "Hello, " + (user.displayName || "User");
  status.textContent = "You are logged in!";
}

function showLogin() {
  loginPage.style.display = "block";
  homePage.style.display = "none";
  status.textContent = "Please login to continue.";
}

document.getElementById("loginBtn").onclick = async () => {
  status.textContent = "Connecting to Google...";

  try {
    const user = await loginWithGoogle();
    showHome(user);
  } catch (error) {
    console.error(error);
    status.textContent = "Login Error: " + error.code;
  }
};

document.getElementById("logoutBtn").onclick = () => {
  status.textContent = "Logout will be connected next.";
};

document.getElementById("exploreBtn").onclick = () => {
  status.textContent = "Public rooms coming soon!";
};

document.getElementById("joinBtn").onclick = () => {
  const code = document.getElementById("roomCode").value.trim();
  status.textContent = code
    ? "Room connection coming soon!"
    : "Enter a room code!";
};

document.getElementById("createBtn").onclick = () => {
  status.textContent = "Room creation coming soon!";
};

showLogin();
</script>

</body>
</html>
