name: Build KVK HUB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'native-call.js'
      - 'scripts/configure_android_foreground_service.py'
      - 'firebase.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/kvk-hub-debug.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html firebase.js noise-processor.js native-call.js www/
          npx esbuild firebase.js --bundle --format=esm --outfile=www/firebase.js --external:https://www.gstatic.com/*
          npx esbuild native-call.js --bundle --format=esm --outfile=www/native-call.js

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android foreground voice service
        run: python3 scripts/configure_android_foreground_service.py

      - name: Prefer Android Media audio while KVK HUB is active
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/java")
          files = list(root.rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")
          path = files[0]
          content = path.read_text()
          imports = [
              "import android.media.AudioManager;",
              "import android.os.Handler;",
              "import android.os.Looper;",
          ]
          lines = content.splitlines(keepends=True)
          insert_at = 1
          for item in imports:
              if item not in content:
                  lines.insert(insert_at, item + "\n")
                  insert_at += 1
          content = "".join(lines)
          if "kvkPreferMediaAudioMode" not in content:
              pattern = r"(public class MainActivity extends BridgeActivity\s*\{)"
              members = """
              private AudioManager kvkAudioManager;
              private final Handler kvkAudioHandler = new Handler(Looper.getMainLooper());
              private int kvkPreviousAudioMode = AudioManager.MODE_NORMAL;
              private boolean kvkActivityResumed = false;
              private boolean kvkChangedAudioMode = false;
              private final Runnable kvkPreferMediaAudioMode = new Runnable() {
                  @Override public void run() {
                      if (!kvkActivityResumed) return;
                      // Only try this when KVK HUB entered from normal mode. Do not
                      // override a communication mode that was already active.
                      if (kvkAudioManager != null
                              && kvkPreviousAudioMode == AudioManager.MODE_NORMAL
                              && kvkAudioManager.getMode() == AudioManager.MODE_IN_COMMUNICATION) {
                          kvkAudioManager.setMode(AudioManager.MODE_NORMAL);
                          kvkChangedAudioMode = true;
                      }
                      kvkAudioHandler.postDelayed(this, 400);
                  }
              };

              @Override
              public void onResume() {
                  super.onResume();
                  kvkAudioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
                  kvkPreviousAudioMode = kvkAudioManager.getMode();
                  kvkChangedAudioMode = false;
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);
                  kvkActivityResumed = true;
                  kvkAudioHandler.removeCallbacks(kvkPreferMediaAudioMode);
                  kvkAudioHandler.postDelayed(kvkPreferMediaAudioMode, 250);
              }

              @Override
              public void onPause() {
                  kvkActivityResumed = false;
                  kvkAudioHandler.removeCallbacks(kvkPreferMediaAudioMode);
                  if (kvkChangedAudioMode && kvkAudioManager != null
                          && kvkAudioManager.getMode() == AudioManager.MODE_NORMAL) {
                      kvkAudioManager.setMode(kvkPreviousAudioMode);
                  }
                  super.onPause();
              }
          """
              content, count = re.subn(pattern, lambda match: match.group(1) + members, content, count=1)
              if count != 1:
                  raise SystemExit("Could not find MainActivity class declaration")
          path.write_text(content)
          print(f"Configured experimental Media audio mode in {path}")
          PY

      - name: Add Android microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("</manifest>", permission + "\n</manifest>")
          manifest.write_text(content)
          PY

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Configure native Google Sign-In
        run: |
          sed -i '/^ext {/a\    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"' android/variables.gradle

      - name: Sync web app and native plugins
        run: npx cap sync android

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/kvk-hub-debug.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/kvk-hub-debug.jks"
          cat >> android/app/build.gradle <<'EOF'

          // Use the repository's stable debug key so Firebase OAuth fingerprints remain consistent.
          android {
              signingConfigs {
                  stableDebug {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          EOF
      
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Report Android signing fingerprints
        working-directory: android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KVK-HUB-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
