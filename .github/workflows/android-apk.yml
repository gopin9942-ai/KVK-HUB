name: Build KVK HUB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'kvk-logo.svg'
      - 'scripts/configure_android_branding.py'
      - 'native-call.js'
      - 'scripts/configure_android_foreground_service.py'
      - 'firebase.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/kvk-hub-debug.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html firebase.js native-call.js kvk-logo.svg www/
          npx esbuild firebase.js --bundle --format=esm --outfile=www/firebase.js --external:https://www.gstatic.com/*
          npx esbuild native-call.js --bundle --format=esm --outfile=www/native-call.js

      - name: Validate embedded app JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline module script, found {len(scripts)}")
          Path("/tmp/kvk-index-inline.mjs").write_text(scripts[0])
          PY
          node --check /tmp/kvk-index-inline.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android foreground voice service
        run: python3 scripts/configure_android_foreground_service.py

      - name: Apply KVK HUB launcher icon and app name
        run: python3 scripts/configure_android_branding.py

      - name: Route foreground hardware volume keys to Media stream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/java")
          files = list(root.rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")
          path = files[0]
          content = path.read_text()
          newline = chr(10)
          for item in ["import android.media.AudioManager;", "import android.view.KeyEvent;"]:
              if item not in content:
                  content = content.replace("package com.kvkhub.voice;", "package com.kvkhub.voice;" + newline + newline + item, 1)
          # The foreground-service generator already creates onCreate(); add the
          # Media hint inside that method rather than declaring a duplicate.
          create_super = "super.onCreate(savedInstanceState);"
          if create_super not in content:
              raise SystemExit("Could not find the existing MainActivity onCreate()")
          if "setVolumeControlStream(AudioManager.STREAM_MUSIC);" not in content:
              content = content.replace(create_super, create_super + newline + "        setVolumeControlStream(AudioManager.STREAM_MUSIC);", 1)
          marker = "public class MainActivity extends BridgeActivity {"
          if marker not in content:
              raise SystemExit("Could not find MainActivity class declaration")
          if "public boolean dispatchKeyEvent(KeyEvent event)" in content:
              raise SystemExit("A custom volume-key handler already exists; refusing to overwrite it")
          methods = """
              @Override
              public void onResume() {
                  super.onResume();
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) setVolumeControlStream(AudioManager.STREAM_MUSIC);
              }

              // Route foreground hardware volume-key presses to Media only.
              // Do not change WebRTC audio mode, microphone capture, or routing.
              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int keyCode = event.getKeyCode();
                  if (keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          AudioManager audio = (AudioManager) getSystemService(AUDIO_SERVICE);
                          if (audio != null && !audio.isVolumeFixed()) {
                              int direction = keyCode == KeyEvent.KEYCODE_VOLUME_UP
                                      ? AudioManager.ADJUST_RAISE : AudioManager.ADJUST_LOWER;
                              audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, AudioManager.FLAG_SHOW_UI);
                          }
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }
          """
          content = content.replace(marker, marker + methods, 1)
          path.write_text(content)
          print(f"Configured foreground hardware volume keys to adjust Media only in {path}")
          PY

      - name: Add Android microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("</manifest>", permission + "\n</manifest>")
          manifest.write_text(content)
          PY

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Configure native Google Sign-In
        run: |
          sed -i '/^ext {/a\    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"' android/variables.gradle

      - name: Sync web app and native plugins
        run: npx cap sync android

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/kvk-hub-debug.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/kvk-hub-debug.jks"
          cat >> android/app/build.gradle <<'EOF'

          // Use the repository's stable debug key so Firebase OAuth fingerprints remain consistent.
          android {
              signingConfigs {
                  stableDebug {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          EOF
      
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Report Android signing fingerprints
        working-directory: android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KVK-HUB-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
