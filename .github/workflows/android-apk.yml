name: Build KVK HUB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'firebase.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kvk-hub-debug.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html firebase.js noise-processor.js www/
          npx esbuild firebase.js --bundle --format=esm --outfile=www/firebase.js --external:https://www.gstatic.com/*

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Configure native Google Sign-In
        run: |
          sed -i '/^ext {/a\    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"' android/variables.gradle

      - name: Sync web app and native plugins
        run: npx cap sync android

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/kvk-hub-debug.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kvk-hub-debug.jks"
          cat >> android/app/build.gradle <<'EOF'

          // Use the repository's stable debug key so Firebase OAuth fingerprints remain consistent.
          android {
              signingConfigs {
                  stableDebug {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stableDebug
                  }
              }
          }
          EOF
      
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Report Android signing fingerprints
        working-directory: android
        run: ./gradlew signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KVK-HUB-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
