name: Build KVK HUB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'firebase.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'google-services.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html firebase.js noise-processor.js www/

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KVK-HUB-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
